{{- if .Values.backend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: easytravel
    environment: {{ .Values.environment }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: easytravel
        environment: {{ .Values.environment }}
    spec:
      imagePullSecrets:
        - name: dockerhub-secret      
      containers:
      - name: backend
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8009
          name: ajp
          protocol: TCP
        - containerPort: 8005
          name: shutdown
          protocol: TCP
        env:
        - name: CATALINA_OPTS
          value: {{ .Values.backend.env.catalinaOpts | quote }}
        - name: ET_DATABASE_LOCATION
          value: "{{ .Values.mongodb.service.name }}:{{ .Values.mongodb.service.port }}"
        - name: ET_MONGO_AUTH_DB
          valueFrom:
            configMapKeyRef:
              name: easytravel-config
              key: MONGODB_AUTH_DB
        - name: ET_DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: easytravel-secrets
              key: MONGODB_USER
        - name: ET_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: easytravel-secrets
              key: MONGODB_PASSWORD
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - name: http
    port: {{ .Values.backend.service.port }}
    targetPort: 8080
    protocol: TCP
  - name: ajp
    port: 8009
    targetPort: 8009
    protocol: TCP
  - name: shutdown
    port: 8005
    targetPort: 8005
    protocol: TCP
  selector:
    app: backend
---
{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
