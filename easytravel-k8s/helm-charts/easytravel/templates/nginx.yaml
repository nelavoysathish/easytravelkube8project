{{- if .Values.nginx.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    app: nginx
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: easytravel
    environment: {{ .Values.environment }}
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/name: nginx
        app.kubernetes.io/part-of: easytravel
        environment: {{ .Values.environment }}
    spec:
      imagePullSecrets:
        - name : dockerhub-secret      
      containers:
      - name: nginx
        image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        - containerPort: 9079
          name: angular
          protocol: TCP
        - containerPort: 8080
          name: backend
          protocol: TCP
        env:
        - name: ET_FRONTEND_LOCATION
          value: "{{ .Values.frontend.service.name }}:{{ .Values.frontend.service.port }}"
        - name: ET_ANGULAR_FRONTEND_LOCATION
          value: "{{ .Values.angularFrontend.service.name }}:{{ .Values.angularFrontend.service.port }}"
        - name: ET_BACKEND_LOCATION
          value: "{{ .Values.backend.service.name }}:{{ .Values.backend.service.port }}"
        resources:
          {{- toYaml .Values.nginx.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nginx.service.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: nginx
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
  - name: http
    port: {{ .Values.nginx.service.ports.http }}
    targetPort: 80
    protocol: TCP
  - name: angular
    port: {{ .Values.nginx.service.ports.angular }}
    targetPort: 9079
    protocol: TCP
  - name: backend
    port: {{ .Values.nginx.service.ports.backend }}
    targetPort: 8080
    protocol: TCP
  selector:
    app: nginx
{{- end }}
