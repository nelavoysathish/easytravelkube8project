# Development Environment Overrides
environment: dev
namespace: easytravel-dev

# Lower resource limits for dev
mongodb:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    size: 5Gi

backend:
  replicaCount: 1
  resources:
    requests:
      memory: "300Mi"
      cpu: "200m"
    limits:
      memory: "400Mi"
      cpu: "400m"
  autoscaling:
    enabled: false

frontend:
  replicaCount: 1
  image:
    repository: sathishtravelsacr.azurecr.io/sathish-travels-frontend
    tag: latest
    pullPolicy: Always
   resources:
    requests:
      memory: "300Mi"
      cpu: "200m"
    limits:
      memory: "400Mi"
      cpu: "400m"
  autoscaling:
    enabled: false
  # Fix health probes - Frontend takes ~90 seconds to start
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 90
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

angularFrontend:
  replicaCount: 1
  resources:
    requests:
      memory: "300Mi"
      cpu: "200m"
    limits:
      memory: "400Mi"
      cpu: "400m"
  autoscaling:
    enabled: false

nginx:
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 80
    angularPort: 9079
    backendPort: 8080
  # Fix health probes - Nginx needs time for backend services
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 45
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

loadgen:
  enabled: false  # Changed to false - image has issues

headlessLoadgen:
  customer:
    enabled: false
  angular:
    enabled: false

ingress:
  enabled: true
  hosts:
    - host: easytravel-dev.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
          service: nginx-service
          port: 80
  tls:
    - secretName: easytravel-dev-tls
      hosts:
        - easytravel-dev.yourdomain.com

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false

serviceMonitor:
  enabled: true
