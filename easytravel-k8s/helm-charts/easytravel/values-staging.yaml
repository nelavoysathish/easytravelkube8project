# Staging Environment Overrides
environment: staging
namespace: easytravel-staging

mongodb:
  replicaCount: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  persistence:
    size: 10Gi

backend:
  replicaCount: 2
  resources:
    requests:
      memory: "400Mi"
      cpu: "300m"
    limits:
      memory: "500Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

frontend:
  replicaCount: 2
  resources:
    requests:
      memory: "400Mi"
      cpu: "300m"
    limits:
      memory: "525Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

angularFrontend:
  replicaCount: 2
  resources:
    requests:
      memory: "400Mi"
      cpu: "300m"
    limits:
      memory: "525Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

nginx:
  replicaCount: 2
  service:
    type: LoadBalancer

loadgen:
  enabled: true
  replicaCount: 1

headlessLoadgen:
  customer:
    enabled: false
  angular:
    enabled: false

ingress:
  enabled: true
  hosts:
    - host: easytravel-staging.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
          service: nginx-service
          port: 80
  tls:
    - secretName: easytravel-staging-tls
      hosts:
        - easytravel-staging.yourdomain.com

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
