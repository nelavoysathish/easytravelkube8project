# Production Environment Overrides
environment: production
namespace: easytravel-prod

mongodb:
  replicaCount: 3
  resources:
    requests:
      memory: "1Gi"
      cpu: "1000m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
  persistence:
    size: 20Gi

backend:
  replicaCount: 3
  resources:
    requests:
      memory: "500Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

frontend:
  replicaCount: 3
  resources:
    requests:
      memory: "500Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

angularFrontend:
  replicaCount: 3
  resources:
    requests:
      memory: "500Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

nginx:
  replicaCount: 3
  service:
    type: LoadBalancer

loadgen:
  enabled: false
  replicaCount: 0

headlessLoadgen:
  customer:
    enabled: false
  angular:
    enabled: false

ingress:
  enabled: true
  hosts:
    - host: easytravel.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
          service: nginx-service
          port: 80
  tls:
    - secretName: easytravel-prod-tls
      hosts:
        - easytravel.yourdomain.com

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
